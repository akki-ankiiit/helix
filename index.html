<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6D4AFF" />
    <meta
      name="description"
      content="Helix — a considered workspace for materials research, formulation, and laboratory validation."
    />
    <link rel="icon" type="image/svg+xml" href="/helix-logo.svg" />
    <title>Helix — AI for Materials</title>
    <script>
      try {
        let t = localStorage.getItem("helix-theme") || "light";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
